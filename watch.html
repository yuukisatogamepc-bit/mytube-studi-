<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>再生 - Mvideo</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; margin: 0; background: #fff; color: #000; }
        header { width: 100%; padding: 12px 20px; border-bottom: 1px solid #f2f2f2; box-sizing: border-box; position: sticky; top: 0; background: #fff; z-index: 100; }
        .logo { font-size: 20px; font-weight: bold; text-decoration: none; color: #ff0000; }
        .main-layout { display: grid; grid-template-columns: 1fr 350px; max-width: 1280px; margin: 0 auto; gap: 24px; padding: 20px; }
        .video-container { width: 100%; }
        .video-wrapper { width: 100%; background: #000; border-radius: 12px; overflow: hidden; }
        video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
        .v-title { font-size: 20px; font-weight: bold; margin: 12px 0 8px; }
        .v-meta { font-size: 14px; color: #606060; margin-bottom: 15px; }
        .action-bar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 15px; border-bottom: 1px solid #f2f2f2; flex-wrap: wrap; gap: 10px; }
        .author-section { display: flex; align-items: center; gap: 12px; }
        .author-icon { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #eee; }
        .author-name-wrap { display: flex; flex-direction: column; }
        .author-name { font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 4px; }
        .sub-count { font-size: 12px; color: #606060; }
        .btn-group { display: flex; align-items: center; gap: 8px; }
        .btn-sub { background: #0f0f0f; color: #fff; padding: 8px 16px; border-radius: 20px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; }
        .btn-like { background: #f2f2f2; color: #000; padding: 8px 16px; border-radius: 20px; border: none; font-size: 14px; cursor: pointer; }
        .btn-del { background: #ff7070; color: #fff; padding: 8px 16px; border-radius: 20px; border: none; display: none; cursor: pointer; }
        .sidebar { display: flex; flex-direction: column; gap: 12px; }
        .related-card { display: flex; gap: 8px; text-decoration: none; color: inherit; }
        .related-thumb { width: 160px; height: 90px; border-radius: 8px; object-fit: cover; background: #eee; }
        .related-info { display: flex; flex-direction: column; gap: 4px; }
        .related-title { font-size: 14px; font-weight: bold; line-height: 1.2; }
        .comment-section { margin-top: 24px; }
        .comment-item { margin-bottom: 16px; font-size: 14px; }
        .admin-badge { color: #ff0000; font-weight: bold; font-size: 12px; }
        .official-badge { color: #007bff; font-weight: bold; font-size: 12px; }
        .admin-editable { cursor: pointer; border-bottom: 1px dotted #ccc; }
        @media (max-width: 1000px) { .main-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header><a href="index.html" class="logo">Mvideo</a></header>

<div class="main-layout">
    <div class="video-container">
        <div class="video-wrapper">
            <video id="player" controls playsinline></video>
        </div>
        <div id="vTitle" class="v-title">読み込み中...</div>
        <div class="v-meta">再生回数 <span id="viewNum" class="stat-val">0</span>回</div>
        <div class="action-bar">
            <div class="author-section">
                <img id="authorIcon" class="author-icon">
                <div class="author-name-wrap">
                    <div id="authorName" class="author-name"></div>
                    <div class="sub-count">登録者 <span id="subNum" class="stat-val">0</span>人</div>
                </div>
                <button class="btn-sub">チャンネル登録</button>
            </div>
            <div class="btn-group">
                <button class="btn-like">👍 <span id="likeNum" class="stat-val">0</span></button>
                <button id="adminDelBtn" class="btn-del">削除</button>
            </div>
        </div>
        <div class="comment-section">
            <div id="commentHeader" class="comment-header">コメント 0件</div>
            <input type="text" id="commentInput" style="width:100%; padding:8px; margin-bottom:20px;" placeholder="コメントを追加...">
            <div id="commentList"></div>
        </div>
    </div>
    <div class="sidebar" id="relatedVideos"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, updateDoc, addDoc, serverTimestamp, onSnapshot, deleteDoc, orderBy, limit, getDocs, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyAZivYKOGc1tSUAIDq_c10C1wJ-Pdh0U2o", 
        authDomain: "mytube-f4544.firebaseapp.com", 
        projectId: "mytube-f4544", 
        storageBucket: "mytube-f4544.firebasestorage.app", 
        messagingSenderId: "655444283107", 
        appId: "1:655444283107:web:04f9173faf2d951790ffd6" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const vid = new URLSearchParams(window.location.search).get("id");
    const ADMIN_UID = "tP5CqCTRO3f2QQ8jdoj0ftY8kZU2";
    const OFFICIAL_UID = "UUgBXquGY5O2iDADKpwNUU0i5Ct2";
    let currentUser = null;
    let videoAuthorId = "";

    onAuthStateChanged(auth, user => {
        currentUser = user;
        if(user && vid && user.uid === ADMIN_UID) setupAdmin();
    });

    function getBadge(uid) {
        if(uid === ADMIN_UID) return '<span class="admin-badge">[運営]</span>';
        if(uid === OFFICIAL_UID) return '<span class="official-badge">[公式]</span>';
        return '';
    }

    async function load() {
        if(!vid) return;
        const vRef = doc(db, "videos", vid);
        const vSnap = await getDoc(vRef);
        if(!vSnap.exists()) return;
        const v = vSnap.data();
        videoAuthorId = v.userId;

        const player = document.getElementById('player');
        if(v.url) { player.src = v.url; player.load(); }

        document.getElementById('vTitle').innerText = v.title;
        document.getElementById('viewNum').innerText = (v.views || 0).toLocaleString();
        document.getElementById('likeNum').innerText = (v.likes || 0).toLocaleString();
        updateDoc(vRef, { views: increment(1) }).catch(()=>{});

        if (v.userId) {
            const uSnap = await getDoc(doc(db, "users", v.userId));
            if (uSnap.exists()) {
                const u = uSnap.data();
                document.getElementById('authorName').innerHTML = (u.name || "不明") + getBadge(v.userId);
                document.getElementById('authorIcon').src = u.icon || "";
                document.getElementById('subNum').innerText = (u.subscribers || 0).toLocaleString();
            }
        }

        loadRelatedVideos();

        onSnapshot(query(collection(db, "videos", vid, "comments"), orderBy("createdAt", "desc")), snap => {
            document.getElementById('commentHeader').innerText = `コメント ${snap.size}件`;
            const list = document.getElementById('commentList');
            list.innerHTML = "";
            snap.forEach(d => {
                const c = d.data();
                list.innerHTML += `<div class="comment-item"><strong>${c.userName || '匿名'}${getBadge(c.userId)}</strong><br>${c.text}</div>`;
            });
        });
    }

    async function loadRelatedVideos() {
        const snap = await getDocs(query(collection(db, "videos"), limit(12)));
        const sidebar = document.getElementById('relatedVideos');
        sidebar.innerHTML = "";
        snap.forEach(d => {
            if(d.id === vid) return;
            const data = d.data();
            // Cloudinaryの自動サムネイル生成を利用 (拡張子を.jpgに変えるだけ)
            let thumb = data.thumbnail || (data.url ? data.url.replace(/\.[^/.]+$/, ".jpg") : "");
            const card = document.createElement('a');
            card.href = `watch.html?id=${d.id}`;
            card.className = 'related-card';
            card.innerHTML = `<img class="related-thumb" src="${thumb}"><div><div class="related-title">${data.title}</div><div class="related-meta">${(data.views || 0).toLocaleString()}回</div></div>`;
            sidebar.appendChild(card);
        });
    }

    function setupAdmin() {
        document.getElementById('adminDelBtn').style.display = "block";
        document.getElementById('adminDelBtn').onclick = async () => {
            if(confirm("削除しますか？")) { await deleteDoc(doc(db, "videos", vid)); location.href="index.html"; }
        };
        document.querySelectorAll('.stat-val').forEach(el => {
            el.classList.add('admin-editable');
            el.onclick = async () => {
                const val = prompt("数値変更:", el.innerText.replace(/,/g, ''));
                if (val && !isNaN(val)) {
                    const num = parseInt(val);
                    const isSub = el.id === "subNum";
                    await updateDoc(doc(db, isSub ? "users" : "videos", isSub ? videoAuthorId : vid), { [isSub ? "subscribers" : (el.id === "viewNum" ? "views" : "likes")]: num });
                    el.innerText = num.toLocaleString();
                }
            };
        });
    }

    document.getElementById('commentInput').onkeypress = async (e) => {
        if (e.key === 'Enter' && currentUser && e.target.value.trim()) {
            const uSnap = await getDoc(doc(db, "users", currentUser.uid));
            await addDoc(collection(db, "videos", vid, "comments"), { text: e.target.value, userName: uSnap.data()?.name || "匿名", userId: currentUser.uid, createdAt: serverTimestamp() });
            e.target.value = "";
        }
    };

    load();
</script>
</body>
</html>
