<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>再生 - Mvideo</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; margin: 0; background: #fff; color: #000; }
        header { width: 100%; padding: 12px 20px; border-bottom: 1px solid #f2f2f2; box-sizing: border-box; position: sticky; top: 0; background: #fff; z-index: 100; }
        .logo { font-size: 20px; font-weight: bold; text-decoration: none; color: #ff0000; }
        .main-layout { display: grid; grid-template-columns: 1fr 350px; max-width: 1280px; margin: 0 auto; gap: 24px; padding: 20px; }
        .video-container { width: 100%; }
        .video-wrapper { width: 100%; background: #000; border-radius: 12px; overflow: hidden; line-height: 0; }
        video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
        .v-title { font-size: 20px; font-weight: bold; margin: 12px 0 8px; }
        .v-meta { font-size: 14px; color: #606060; margin-bottom: 15px; }
        .action-bar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 15px; border-bottom: 1px solid #f2f2f2; }
        .author-section { display: flex; align-items: center; gap: 12px; }
        .author-icon { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #eee; }
        .author-name { font-weight: bold; font-size: 15px; }
        .btn-sub { background: #0f0f0f; color: #fff; padding: 8px 16px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; }
        .sidebar { display: flex; flex-direction: column; gap: 12px; }
        .related-card { display: flex; gap: 8px; text-decoration: none; color: inherit; }
        .related-thumb { width: 160px; height: 90px; border-radius: 8px; object-fit: cover; background: #eee; }
        .admin-badge { color: #ff0000; font-weight: bold; font-size: 12px; }
        @media (max-width: 1000px) { .main-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header><a href="index.html" class="logo">Mvideo</a></header>

<div class="main-layout">
    <div class="video-container">
        <div class="video-wrapper">
            <video id="player" controls playsinline crossorigin="anonymous"></video>
        </div>
        <div id="vTitle" class="v-title">読み込み中...</div>
        <div class="v-meta">再生回数 <span id="viewNum">0</span>回</div>
        <div class="action-bar">
            <div class="author-section">
                <img id="authorIcon" class="author-icon" src="">
                <div class="author-name-wrap">
                    <div id="authorName" class="author-name"></div>
                </div>
                <button class="btn-sub">チャンネル登録</button>
            </div>
            <button id="adminDelBtn" style="display:none; background:#ff7070; color:#fff; border:none; padding:8px; border-radius:5px; cursor:pointer;">削除</button>
        </div>
    </div>
    <div class="sidebar" id="relatedVideos"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, updateDoc, deleteDoc, limit, getDocs, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyAZivYKOGc1tSUAIDq_c10C1wJ-Pdh0U2o", 
        authDomain: "mytube-f4544.firebaseapp.com", 
        projectId: "mytube-f4544", 
        storageBucket: "mytube-f4544.firebasestorage.app", 
        messagingSenderId: "655444283107", 
        appId: "1:655444283107:web:04f9173faf2d951790ffd6" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const vid = new URLSearchParams(window.location.search).get("id");
    const ADMIN_UID = "tP5CqCTRO3f2QQ8jdoj0ftY8kZU2";

    onAuthStateChanged(auth, user => {
        if(user && vid && user.uid === ADMIN_UID) {
            const btn = document.getElementById('adminDelBtn');
            btn.style.display = "block";
            btn.onclick = async () => { if(confirm("削除しますか？")) { await deleteDoc(doc(db, "videos", vid)); location.href="index.html"; } };
        }
    });

    async function load() {
        if(!vid) return;
        const vSnap = await getDoc(doc(db, "videos", vid));
        if(!vSnap.exists()) return;
        const v = vSnap.data();

        const player = document.getElementById('player');
        
        // 【最強の修復ロジック】URLが何であれ、強制的に.mp4として読み込む
        if(v.url) {
            let videoUrl = v.url.split('?')[0]; // 余計なパラメータをカット
            if (videoUrl.endsWith('.jpg')) {
                videoUrl = videoUrl.replace('.jpg', '.mp4');
            }
            player.src = videoUrl;
            player.load();
        }

        document.getElementById('vTitle').innerText = v.title;
        document.getElementById('viewNum').innerText = (v.views || 0).toLocaleString();
        updateDoc(doc(db, "videos", vid), { views: increment(1) }).catch(()=>{});

        if (v.userId) {
            const uSnap = await getDoc(doc(db, "users", v.userId));
            if (uSnap.exists()) {
                const u = uSnap.data();
                document.getElementById('authorName').innerHTML = (u.name || "不明") + (v.userId === ADMIN_UID ? ' <span class="admin-badge">[運営]</span>' : '');
                document.getElementById('authorIcon').src = u.icon || "";
            }
        }
        loadSidebar();
    }

    async function loadSidebar() {
        const snap = await getDocs(query(collection(db, "videos"), limit(10)));
        const sidebar = document.getElementById('relatedVideos');
        sidebar.innerHTML = "";
        snap.forEach(d => {
            if(d.id === vid) return;
            const data = d.data();
            // サムネが壊れていたら動画URLから自動生成
            let thumb = data.thumbnail || (data.url ? data.url.replace('.mp4', '.jpg') : "");
            sidebar.innerHTML += `
                <a href="watch.html?id=${d.id}" class="related-card">
                    <img src="${thumb}" class="related-thumb">
                    <div class="related-title">${data.title}</div>
                </a>`;
        });
    }

    load();
</script>
</body>
</html>
